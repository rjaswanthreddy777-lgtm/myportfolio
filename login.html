<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login Logout Without JS</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    body{
        margin:0;
        height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
        font-family:Arial, sans-serif;
        background:linear-gradient(135deg,#43cea2,#185a9d);
    }

    .box{
        background:#fff;
        width:320px;
        padding:25px;
        border-radius:12px;
        box-shadow:0 10px 25px rgba(0,0,0,0.3);
        text-align:center;
    }

    h2{color:#333;}

    input[type="text"],
    input[type="password"]{
        width:100%;
        padding:10px;
        margin:10px 0;
        border-radius:5px;
        border:1px solid #ccc;
    }

    label.btn{
        display:block;
        margin-top:15px;
        padding:10px;
        background:#185a9d;
        color:white;
        border-radius:5px;
        cursor:pointer;
    }

    label.btn:hover{background:#0f3f6e;}

    /* hide checkbox */
    #toggle{display:none;}

    /* hide welcome initially */
    .welcome{display:none;}

    /* when checkbox checked */
    #toggle:checked ~ .login{display:none;}
    #toggle:checked ~ .welcome{display:block;}

</style>
</head>
<body>

<input type="checkbox" id="toggle">

<!-- LOGIN -->
<div class="box login">
    <h2>Login</h2>
    <input type="text" placeholder="Username">
    <input type="password" placeholder="Password">
    <label for="toggle" class="btn">Login</label>
</div>

<!-- WELCOME -->
<div class="box welcome">
    <h2>Welcome</h2>
    <p>You are logged in</p>
    <label for="toggle" class="btn">Logout</label>
</div>

</body>
</html>
